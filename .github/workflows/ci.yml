name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      # Fail the build if a real-looking credential ever appears in source again.
      - name: Secret scan
        run: |
          if grep -rInE 'sk_[A-Za-z0-9]{20,}|[A-Fa-f0-9]{40}' src src-tauri/src --include='*.ts' --include='*.tsx' --include='*.rs'; then
            echo "::error::possible credential committed to source"
            exit 1
          fi

  rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tauri::generate_context! validates that frontendDist exists at compile time,
      # so the frontend must be built before any cargo command runs.
      - run: npm ci
      - run: npm run build

      - run: cargo fmt --all --check
        working-directory: src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
