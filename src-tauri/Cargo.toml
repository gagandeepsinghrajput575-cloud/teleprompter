[package]
name = "stealthprompter"
version = "0.1.0"
description = "Real-time semantic sales HUD"
authors = ["gaganrajput11"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "stealthprompter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.17.1"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "sync", "time", "macros"] }
tokio-tungstenite = { version = "0.29.0", features = ["native-tls"] }
futures-util = "0.3.34"
reqwest = { version = "0.13.3", features = ["json"] }
hound = "3.5.1"
tauri-plugin-global-shortcut = "2.3.2"

[target."cfg(target_os = \"macos\")".dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", features = [
  "NSWindow",
  "NSEvent",
  "NSGraphicsContext",
  "NSApplication",
  "NSResponder",
] }
objc2-foundation = { version = "0.3", features = ["NSGeometry"] }
